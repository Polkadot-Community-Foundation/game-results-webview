name: Deploy to Polkadot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip-cache:
        description: "Skip deployment cache and force redeploy"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assert bundle is Paseo-free
        run: |
          if grep -rIil 'paseo' dist; then echo "::error::Paseo reference in built bundle"; exit 1; fi
          echo "OK: no Paseo in bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: game-webview-build
          path: dist
          retention-days: 1

  # PR previews deploy to previewnet only (env: preview).
  deploy-preview:
    needs: build
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    uses: paritytech/bulletin-deploy/.github/workflows/deploy.yml@main
    with:
      artifact-name: game-webview-build
      dotns-domain: game-webview-pr${{ github.event.pull_request.number }}-preview00.dot
      comment-on-pr: true
      env: preview
      gateway: dot.li
      skip-cache: true
      max-retries: 10
      bulletin-deploy-version: "0.7.30-rc.0"
    secrets:
      mnemonic: ${{ secrets.DOTNS_MNEMONIC }}

  # Production (push to main / manual) publishes game-webview.dot to previewnet
  # only (env: preview). The Paseo (paseo-next-v2 / paseo.li) leg has been
  # removed — PCF CI must never deploy to Paseo. The former matrix collapses to
  # a single previewnet call.
  #
  # NOTE: this reusable workflow (paritytech/bulletin-deploy) has no `summit`
  # env, so it cannot target Summit. The production Summit deploy is done out of
  # band via the polkadot-app-deploy CLI (see the Summit webviews runbook).
  # Migrating this job to a Summit-capable workflow is tracked separately.
  #
  # skip-cache: true is kept (harmless for a single leg; the reusable workflow
  # keys its deploy cache on the build-content hash only).
  deploy-production:
    needs: build
    name: Deploy Production (preview)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: paritytech/bulletin-deploy/.github/workflows/deploy.yml@main
    with:
      artifact-name: game-webview-build
      dotns-domain: game-webview.dot
      env: preview
      gateway: dot.li
      skip-cache: true
      max-retries: 10
      bulletin-deploy-version: "0.7.30-rc.0"
    secrets:
      mnemonic: ${{ secrets.DOTNS_MNEMONIC }}
