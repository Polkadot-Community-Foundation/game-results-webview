# Builds the webview and deploys it to Polkadot Bulletin storage via the
# Polkadot-Community-Foundation/polkadot-app-deploy reusable workflow.
#
#   pull request  → game-webview-pr<N>-preview00.dot on devnet
#   push to main  → game-results-webview.dot on devnet
#
# The reusable-workflow ref (@v0.16.7) and polkadot-app-deploy-version are
# pinned to the same release — bump them together.
name: Deploy to Polkadot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per ref on main). Superseded PR runs are cancelled;
# production runs queue instead, so an in-flight chain deploy is never
# killed partway through.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: game-webview-build
          path: dist
          retention-days: 1

  # PR previews deploy to devnet (Paseo system chains) on a throwaway
  # subdomain per PR, and post the preview URL as a sticky PR comment.
  deploy-preview:
    name: Deploy preview
    needs: [typecheck, build]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # sticky PR comment with the preview URL
    uses: Polkadot-Community-Foundation/polkadot-app-deploy/.github/workflows/deploy.yml@v0.16.7
    with:
      artifact-name: game-webview-build
      dotns-domain: game-webview-pr${{ github.event.pull_request.number }}-preview00.dot
      comment-on-pr: true
      env: devnet
      gateway: dev-dot.li
      skip-cache: true
      max-retries: 10
      # Embedded by the native app; never list it in the browse directory.
      publish: false
      polkadot-app-deploy-version: "0.16.7"
    secrets:
      mnemonic: ${{ secrets.DOTNS_MNEMONIC }}

  # Production (push to main / manual dispatch) publishes
  # game-results-webview.dot to devnet. skip-cache: true forces a redeploy
  # even when the build content is unchanged.
  deploy-production:
    name: Deploy production (devnet)
    needs: [typecheck, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: Polkadot-Community-Foundation/polkadot-app-deploy/.github/workflows/deploy.yml@v0.16.7
    with:
      artifact-name: game-webview-build
      dotns-domain: game-results-webview.dot
      env: devnet
      gateway: dev-dot.li
      skip-cache: true
      max-retries: 10
      # Embedded by the native app; never list it in the browse directory.
      publish: false
      polkadot-app-deploy-version: "0.16.7"
    secrets:
      mnemonic: ${{ secrets.DOTNS_MNEMONIC }}
